<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply to Jobs – CV Skill Tree</title>
  <link rel="stylesheet" href="/static/index.css">
  <link rel="stylesheet" href="/static/apply.css">
</head>

<body class="apply-page">
  <header class="apply-header">
    <h1>Apply to Jobs</h1>
  </header>

  <div class="apply-content">
    <div class="apply-grid">
      {% for job in jobs %}
      <div class="apply-square" data-index="{{ loop.index0 }}" data-job-id="{{ job.id if job else '' }}" aria-label="{{ job.title if job else 'Job ' ~ loop.index }}">
        {% if job %}
        <div class="apply-square-inner">
          <div class="apply-square-title">{{ job.title }}</div>
          <div class="apply-square-company">{{ job.company_name }}</div>
          <div class="apply-square-preview">{{ job.preview }}</div>
        </div>
        {% else %}
        <div class="apply-square-inner apply-square-empty">No job</div>
        {% endif %}
      </div>
      {% endfor %}
    </div>
    <div class="apply-refresh-wrap">
      <a href="/apply" class="apply-refresh" id="apply-refresh" aria-label="Refresh to load 5 new random jobs">
        <svg class="apply-refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M23 4v6h-6M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </a>
    </div>
  </div>
</body>

</html>
