<!DOCTYPE html>
<html lang="en" class="h-full bg-zinc-950">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload CV - Istanbulsfinest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        [hidden] { display: none !important; }
        .drop-zone--over { border-color: #6366f1 !important; background-color: rgba(99, 102, 241, 0.05); }
    </style>
</head>

<body class="h-full">
    <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-xl">
            <h2 class="text-center text-3xl font-bold tracking-tight text-white">Upload your <span class="text-indigo-500">Professional Identity</span></h2>
            <p class="mt-4 text-center text-sm text-zinc-400">Verifiable skills start here. We'll parse your CV and anchor it to the Solana blockchain.</p>
        </div>

        <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-xl">
            <form action="/applicant/profile" method="POST" enctype="multipart/form-data" class="space-y-8 bg-zinc-900/50 p-8 rounded-2xl border border-zinc-800 shadow-2xl">
                
                <!-- CV UPLOAD ZONE -->
                <div class="space-y-2">
                    <label class="block text-sm font-medium leading-6 text-white">CV (PDF)</label>
                    <div id="drop-zone" class="relative group mt-2 flex justify-center rounded-xl border border-dashed border-zinc-700 px-6 py-10 transition-all hover:border-zinc-500 cursor-pointer">
                        <div class="text-center space-y-4">
                            <svg class="mx-auto h-12 w-12 text-zinc-500 group-hover:text-indigo-400 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                            </svg>
                            <div class="flex flex-col text-sm leading-6 text-zinc-400">
                                <span id="prompt-text" class="font-semibold text-indigo-400 group-hover:text-indigo-300">Click to upload</span>
                                <span id="filename-display" class="hidden text-white font-medium truncate max-w-xs"></span>
                                <p class="pl-1">or drag and drop</p>
                            </div>
                            <p class="text-xs leading-5 text-zinc-500">PDF up to 10MB</p>
                        </div>
                        <input id="cv-file" name="cv" type="file" accept=".pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required>
                    </div>
                </div>

                <!-- WALLET SECTION -->
                <div class="pt-4 border-t border-zinc-800">
                    <label for="solana_wallet" class="block text-sm font-medium leading-6 text-white flex justify-between">
                        Solana Wallet Address
                        <span class="text-indigo-400 text-xs font-bold uppercase tracking-wider">Required</span>
                    </label>
                    <div class="mt-2 group relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                            <svg class="h-5 w-5 text-zinc-500 group-focus-within:text-indigo-500" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M21 18V19C21 20.1 20.1 21 19 21H5C3.89 21 3 20.1 3 19V5C3 3.9 3.89 3 5 3H19C20.1 3 21 3.9 21 5V6H12C10.89 6 10 6.89 10 8V16C10 17.11 10.89 18 12 18H21ZM12 16H22V8H12V16ZM16 13.5C15.17 13.5 14.5 12.83 14.5 12C14.5 11.17 15.17 10.5 16 10.5C16.83 10.5 17.5 11.17 17.5 12C17.5 12.83 16.83 13.5 16 13.5Z"/>
                            </svg>
                        </div>
                        <input id="solana_wallet" name="solana_wallet" type="text" required placeholder="Ex: 8y9...xYZ" class="block w-full rounded-md border-0 bg-white/5 py-2 pl-10 text-white shadow-sm ring-1 ring-inset ring-white/10 focus:ring-2 focus:ring-inset focus:ring-indigo-500 sm:text-sm sm:leading-6 placeholder:text-zinc-600">
                    </div>
                </div>

                <!-- OPTIONAL SOCIALS -->
                <div class="space-y-4 pt-4 border-t border-zinc-800">
                    <div class="flex items-center justify-between">
                        <h3 class="text-sm font-semibold text-zinc-400 uppercase tracking-widest">Optional socials</h3>
                        <span class="h-px bg-zinc-800 flex-1 ml-4"></span>
                    </div>
                    
                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                        <div>
                            <label for="linkedin" class="block text-xs font-medium text-zinc-500 mb-1">LinkedIn</label>
                            <input id="linkedin" name="linkedin" type="url" placeholder="linkedin.com/in/..." class="block w-full rounded-lg border-0 bg-white/5 py-1.5 text-white ring-1 ring-inset ring-white/10 focus:ring-2 focus:ring-indigo-500 sm:text-sm px-3 placeholder:text-zinc-700">
                        </div>
                        <div>
                            <label for="github" class="block text-xs font-medium text-zinc-500 mb-1">GitHub</label>
                            <input id="github" name="github" type="url" placeholder="github.com/..." class="block w-full rounded-lg border-0 bg-white/5 py-1.5 text-white ring-1 ring-inset ring-white/10 focus:ring-2 focus:ring-indigo-500 sm:text-sm px-3 placeholder:text-zinc-700">
                        </div>
                        <div class="sm:col-span-2">
                            <label for="portfolio" class="block text-xs font-medium text-zinc-500 mb-1">Portfolio or Website</label>
                            <input id="portfolio" name="portfolio" type="url" placeholder="https://yourpage.com" class="block w-full rounded-lg border-0 bg-white/5 py-1.5 text-white ring-1 ring-inset ring-white/10 focus:ring-2 focus:ring-indigo-500 sm:text-sm px-3 placeholder:text-zinc-700">
                        </div>
                    </div>
                </div>

                <div class="pt-6">
                    <button type="submit" class="flex w-full justify-center rounded-md bg-indigo-600 px-4 py-2.5 text-sm font-bold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition-all active:scale-95">
                        Build Verification Identity
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('cv-file');
        const promptText = document.getElementById('prompt-text');
        const filenameDisplay = document.getElementById('filename-display');

        function updateFileDisplay() {
            if (fileInput.files.length > 0) {
                promptText.classList.add('hidden');
                filenameDisplay.textContent = fileInput.files[0].name;
                filenameDisplay.classList.remove('hidden');
                dropZone.classList.add('border-indigo-500', 'bg-indigo-500/5');
            } else {
                promptText.classList.remove('hidden');
                filenameDisplay.classList.add('hidden');
                dropZone.classList.remove('border-indigo-500', 'bg-indigo-500/5');
            }
        }

        fileInput.addEventListener('change', updateFileDisplay);

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => {
                e.preventDefault();
                dropZone.classList.add('drop-zone--over');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => {
                e.preventDefault();
                dropZone.classList.remove('drop-zone--over');
            });
        });

        dropZone.addEventListener('drop', e => {
            const dt = e.dataTransfer;
            const files = dt.files;
            fileInput.files = files;
            updateFileDisplay();
        });
    </script>
</body>

</html>
