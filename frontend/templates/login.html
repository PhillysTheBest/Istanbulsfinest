<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="/static/login.css">
</head>
<body>
  <div class="auth-page">
    <section class="auth-card">
      <h1>Login</h1>
      {% if error %}
      <div class="message error" role="alert">{{ error }}</div>
      {% endif %}
      <form action="/login" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit">Sign in</button>
      </form>
    </section>

    <p class="auth-divider">or</p>

    <section class="auth-card signup-card">
      <h2>Sign up</h2>
      {% if signup_success %}
      <div class="message success" role="alert">{{ signup_success }}</div>
      {% endif %}
      {% if signup_error %}
      <div class="message error" role="alert">{{ signup_error }}</div>
      {% endif %}
      <form action="/signup" method="post">
        <label for="signup-username">Username</label>
        <input type="text" id="signup-username" name="username" autocomplete="username" required>

        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" name="password" autocomplete="new-password" required>

        <label for="signup-role">Role</label>
        <select id="signup-role" name="role">
          <option value="applicant">Applicant</option>
          <option value="recruiter">Recruiter</option>
        </select>

        <button type="submit">Create account</button>
      </form>
    </section>
  </div>
</body>
</html>
